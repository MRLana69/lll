<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escolha o mapeamento</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
main{width:min(100%,420px);text-align:center}
h1{font-size:clamp(23px,6vw,32px);font-weight:700;margin:0 0 22px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
button{font:inherit;cursor:pointer;color:#fff;background:#171717;border:1px solid #555;border-radius:8px;min-height:54px;padding:10px}
.choice[aria-pressed="true"]{border-color:#fff;background:#303030}
.play{width:100%;min-height:62px;background:#fff;color:#000;border:0;border-radius:9px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
.play-icon{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:17px solid #000}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Escolha o mapeamento</h1>
<div class="choices" role="group" aria-label="Mapeamento do teclado">
<button class="choice" type="button" data-file="indexWASD.html" aria-pressed="true">WASD</button>
<button class="choice" type="button" data-file="indexTFGH.html" aria-pressed="false">TFGH</button>
<button class="choice" type="button" data-file="indexIJKL.html" aria-pressed="false">IJKL</button>
<button class="choice" type="button" data-file="indexArrows.html" aria-pressed="false">Arrows</button>
</div>
<button class="play" id="play" type="button"><span class="play-icon" aria-hidden="true"></span><span>Jogar</span></button>
</main>
<script>
(function(){var selected='indexWASD.html';var choices=[].slice.call(document.querySelectorAll('.choice'));choices.forEach(function(button){button.addEventListener('click',function(){selected=button.dataset.file;choices.forEach(function(item){item.setAttribute('aria-pressed',item===button?'true':'false');});});});document.getElementById('play').addEventListener('click',function(){location.href=selected;});})();
</script>
</body>
</html>
